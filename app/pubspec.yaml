name: intono_app
description: "Intono violin intonation trainer."
publish_to: none
version: 0.1.0+1

environment:
  sdk: ^3.14.0

dependencies:
  flutter:
    sdk: flutter
  ffi: ^2.2.0
  # the local practice database (ADR 0015): drift on SQLite, the file in Application Support (iOS) / databases (Android)
  drift: ^2.26.0
  path: ^1.9.0
  path_provider: ^2.1.0
  intono_ios:   # iOS platform side (ADR 0010); ignored on Android
    path: packages/intono_ios

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  ffigen: ^23.0.0
  # ADR 0015: drift's code generator (practice_db.g.dart is checked in; CI regenerates it and fails on a difference)
  drift_dev: ^2.26.0
  build_runner: ^2.4.0
  integration_test:   # the on-device database test (ADR 0015 decision 1)
    sdk: flutter

flutter:
  uses-material-design: false
  assets:
    - assets/scales/beginner.json   # generated by tools/scales/gen_scales.py (ADR 0011)
    - assets/config/grading.json    # scale grading thresholds, bundled (ADR 0011, ADR 0012)
    - assets/config/coaching.json   # coaching tip thresholds, bundled (ADR 0016)
