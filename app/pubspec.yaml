name: intono_app
description: "Intono violin intonation trainer. Phase 2 skeleton - engine bindings, vsync polling, debug screen."
publish_to: none
version: 0.1.0+1

environment:
  sdk: ^3.14.0

dependencies:
  flutter:
    sdk: flutter
  ffi: ^2.2.0
  intono_ios:   # iOS platform side (ADR 0010); ignored on Android
    path: packages/intono_ios

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  ffigen: ^23.0.0

flutter:
  uses-material-design: false
  assets:
    - assets/scales/beginner.json   # generated by tools/scales/gen_scales.py (ADR 0011)
