# Bindings for the Intono C API, generated from the contract header (ADR 0009 decision 3). CI regenerates this file and fails if the
# checked-in copy differs, so a header change without regenerated bindings cannot merge.
#   cd app && dart run ffigen --config ffigen.yaml      (needs libclang)
name: IntonoBindings
description: Bindings for dsp/include/intono/intono.h. GENERATED by ffigen, do not edit.
output: lib/src/ffi/intono_bindings.dart
headers:
  entry-points:
    - ../dsp/include/intono/intono.h
  include-directives:
    - ../dsp/include/intono/intono.h
preamble: |
  // GENERATED CODE - DO NOT MODIFY BY HAND. Source: dsp/include/intono/intono.h (see app/ffigen.yaml).
  // ignore_for_file: type=lint
comments:
  style: any
  length: full
