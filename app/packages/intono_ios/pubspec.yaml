name: intono_ios
description: "Intono's iOS platform side (ADR 0010): the AVAudioEngine shim behind the method channel intono/audio. Local, not published."
version: 0.0.1
publish_to: none

environment:
  sdk: ^3.14.0
  flutter: '>=3.3.0'

dependencies:
  flutter:
    sdk: flutter

flutter:
  plugin:
    platforms:
      ios:
        pluginClass: IntonoIosPlugin
