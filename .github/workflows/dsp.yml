name: dsp
# CI cost and speed (2026-11-27): pushes run CI only on main, pull requests run it once (no duplicate push + PR runs of the same commit);
# a newer push to a PR cancels its running jobs (main is never cancelled, so every main commit gets a result); every job has a timeout;
# apt goes through .github/scripts/apt-install.sh (drops the unused packages.microsoft.com source, which returned 403, and retries).
on:
  workflow_dispatch:   # manual runs (no path filter)
  schedule:
    - cron: "17 3 * * 1"   # weekly: golden-provenance re-checks the stored phase1-complete outputs against a fresh build of the tag
  push:
    branches: [main]
    paths: ["dsp/**", "tools/accuracy/**", ".github/workflows/dsp.yml"]
  pull_request:
    paths: ["dsp/**", "tools/accuracy/**", ".github/workflows/dsp.yml"]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PY_PINS: numpy==2.5.3 scipy==1.18.1 soundfile==0.14.0   # the versions tools/accuracy/golden/phase1-complete.json was made with

jobs:
  test:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      matrix:
        sanitizer: [none, address, thread]
    steps:
      - uses: actions/checkout@v4
      - run: .github/scripts/apt-install.sh ninja-build cmake
      - run: cmake -S dsp -B build -G Ninja -DINTONO_SANITIZE=${{ matrix.sanitizer }}
      - run: cmake --build build
      - run: ctest --test-dir build --output-on-failure   # includes the real-time safety test when sanitizer=none

  accuracy-gate:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: .github/scripts/apt-install.sh ninja-build cmake libsndfile1
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install numpy scipy librosa mir_eval soundfile
      - run: cmake -S dsp -B build -G Ninja -DINTONO_BUILD_TESTS=OFF && cmake --build build
      # Fails if a target is missed or any metric regresses by more than 0.5 pp / 0.5 c against Phase 0.
      - run: python tools/accuracy/run_cpp.py --cli build/intono-cli
      - uses: actions/upload-artifact@v4
        with: { name: accuracy-report, path: tools/accuracy/reports/phase1 }

  # Real arm64 silicon (Apple M-series): runs the whole unit-test suite with the NEON pffft path and the ARM memory
  # model. The real-time safety test is Linux-only (link-time malloc wrapping) and is skipped by CMake here.
  test-macos-arm64:
    if: github.event_name != 'schedule'
    runs-on: macos-15   # pinned Apple Silicon label, never macos-latest: upgrades are deliberate (macos-14 is not available to this account)
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: brew install ninja
      - run: cmake -S dsp -B build -G Ninja -DINTONO_SANITIZE=none
      - run: cmake --build build
      - run: ctest --test-dir build --output-on-failure

  # libintono.so for Android, built with the NDK that ships on the runner image (no third-party action).
  # Checks that matter for Flutter's FFI: only the 8 intono_* functions are exported, nothing needs
  # libc++_shared.so, and every LOAD segment is 16 KB aligned (Google Play requirement for Android 15+).
  android:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      matrix:
        abi: [arm64-v8a, armeabi-v7a, x86_64]
    steps:
      - uses: actions/checkout@v4
      - run: .github/scripts/apt-install.sh ninja-build
      - name: Locate the NDK
        run: |
          NDK="${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_HOME}"
          test -f "$NDK/build/cmake/android.toolchain.cmake" || { echo "no NDK on this runner image"; exit 1; }
          echo "NDK=$NDK" >> "$GITHUB_ENV"
          grep Pkg.Revision "$NDK/source.properties"
      - name: Build
        run: |
          cmake -S dsp -B build -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$NDK/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=${{ matrix.abi }} -DANDROID_PLATFORM=android-24 -DANDROID_STL=c++_static \
            -DANDROID_ARM_NEON=ON -DCMAKE_BUILD_TYPE=Release \
            -DINTONO_SHARED=ON -DINTONO_BUILD_TESTS=OFF -DINTONO_BUILD_CLI=OFF
          cmake --build build
      - name: Check the library
        run: |
          BIN="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin"
          SO=build/libintono.so
          test -f "$SO"
          "$BIN/llvm-nm" -D --defined-only "$SO" | awk '$2=="T"{print $3}' | sort > exported.txt
          cat exported.txt
          printf '%s\n' intono_create intono_destroy intono_drone_render intono_drone_set intono_process \
            intono_read_frames intono_read_notes intono_set_expected intono_set_tonic | sort > expected.txt
          diff expected.txt exported.txt
          # The standalone libintono.so keeps the static STL. The app's libintono_android.so uses the shared STL because Oboe's Prefab
          # package requires it (ADR 0009 Amendment 1); that is checked in the app's workflow, which requires libc++_shared.so there.
          if "$BIN/llvm-readelf" -d "$SO" | grep -q 'libc++_shared'; then echo "standalone libintono.so links libc++_shared.so"; exit 1; fi
          "$BIN/llvm-readelf" -lW "$SO" | awk '$1=="LOAD"{print $NF}' | while read a; do
            [ $((a)) -ge 16384 ] || { echo "LOAD segment aligned to $a, need 0x4000"; exit 1; }
          done
          ls -l "$SO"
      - uses: actions/upload-artifact@v4
        with: { name: "libintono-android-${{ matrix.abi }}", path: build/libintono.so }

  # ADR 0005, option B: the unit tests run on an Android emulator (API 34, x86_64, KVM) with the NDK and SDK tools that ship on the
  # runner image, no third-party action. The real-time safety binary is not built for Android (it wraps glibc symbols). The suite runs
  # twice, as on the host: inline, and through the note worker thread (INTONO_TEST_THREADED=1, ADR 0008). arm64 is not executed here.
  android-test:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Free disk space (the emulator's userdata partition needs about 7.4 GB; the Android SDK is kept)
        run: |
          df -h / | tail -1
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost /opt/hostedtoolcache/CodeQL /usr/local/.ghcup /usr/share/swift
          df -h / | tail -1
      - run: .github/scripts/apt-install.sh ninja-build libpulse0 libnss3 libxcb-cursor0   # libpulse0: the emulator's qemu links it even headless
      - name: Locate the NDK
        run: |
          NDK="${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_HOME}"
          test -f "$NDK/build/cmake/android.toolchain.cmake" || { echo "no NDK on this runner image"; exit 1; }
          echo "NDK=$NDK" >> "$GITHUB_ENV"
          grep Pkg.Revision "$NDK/source.properties"
      - name: Build the unit tests for x86_64 (bionic)
        run: |
          cmake -S dsp -B build -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$NDK/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=x86_64 -DANDROID_PLATFORM=android-24 -DANDROID_STL=c++_static \
            -DCMAKE_BUILD_TYPE=Release -DINTONO_BUILD_CLI=OFF
          cmake --build build --target intono_tests
          file build/intono_tests
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm || { echo "no /dev/kvm on this runner: the emulator would be software-only and far too slow (see ADR 0005)"; exit 1; }
      - name: Install the emulator and the system image
        run: |
          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          echo "SDK=$SDK" >> "$GITHUB_ENV"
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$SDK/cmdline-tools/latest/bin/sdkmanager" --install "platform-tools" "emulator" "system-images;android-34;google_apis;x86_64"
          "$SDK/cmdline-tools/latest/bin/sdkmanager" --list_installed | grep -E "platform-tools|emulator|system-images"   # the exact revisions used, for the log
      - name: Boot the emulator and run the tests
        run: |
          export PATH="$SDK/platform-tools:$SDK/emulator:$SDK/cmdline-tools/latest/bin:$PATH"
          export ANDROID_AVD_HOME="$HOME/.android/avd"; mkdir -p "$ANDROID_AVD_HOME"   # avdmanager and emulator must agree on where AVDs live
          printf 'no\n' | avdmanager create avd -n ci -k "system-images;android-34;google_apis;x86_64" -d pixel_5 --force
          avdmanager list avd | head -12
          emulator -list-avds | grep -x ci
          emulator -version | head -3
          nohup emulator -avd ci -no-window -no-audio -no-boot-anim -no-snapshot -no-metrics -gpu swiftshader_indirect -accel on > emulator.log 2>&1 &
          EMU=$!
          for i in $(seq 1 120); do
            kill -0 $EMU 2>/dev/null || { echo "emulator process exited early"; cat emulator.log; exit 1; }
            [ "$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" = "1" ] && break
            [ $((i % 6)) -eq 0 ] && { echo "--- waiting ($((i*5)) s), adb devices:"; adb devices; tail -5 emulator.log; }
            sleep 5
          done
          [ "$(adb shell getprop sys.boot_completed | tr -d '\r')" = "1" ] || { echo "emulator did not boot"; cat emulator.log; exit 1; }
          adb shell getprop ro.build.version.sdk; adb shell getprop ro.product.cpu.abi
          adb push build/intono_tests /data/local/tmp/intono_tests
          adb shell chmod +x /data/local/tmp/intono_tests
          rc=0
          for mode in inline threaded; do
            env=""; [ "$mode" = threaded ] && env="INTONO_TEST_THREADED=1"
            adb shell "cd /data/local/tmp && $env ./intono_tests; echo EXIT=\$?" 2>&1 | tee "tests-$mode.log"
            grep -q "EXIT=0" "tests-$mode.log" && grep -q "PASSED" "tests-$mode.log" || rc=1
          done
          adb emu kill || true
          exit $rc
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: android-test-logs, path: "*.log" }

  # Static libraries for iOS device and simulator, merged with pffft and packaged as an xcframework for the Flutter plugin.
  ios:
    if: github.event_name != 'schedule'
    runs-on: macos-15   # pinned (see test-macos-arm64)
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: brew install ninja
      - name: Build device and simulator slices
        run: |
          build() {  # name sdk archs
            cmake -S dsp -B "build/$1" -G Ninja \
              -DCMAKE_SYSTEM_NAME=iOS -DCMAKE_OSX_SYSROOT="$2" -DCMAKE_OSX_ARCHITECTURES="$3" \
              -DCMAKE_OSX_DEPLOYMENT_TARGET=13.0 -DCMAKE_BUILD_TYPE=Release \
              -DCMAKE_TRY_COMPILE_TARGET_TYPE=STATIC_LIBRARY \
              -DINTONO_BUILD_TESTS=OFF -DINTONO_BUILD_CLI=OFF
            cmake --build "build/$1"
            libtool -static -o "build/$1/libintono_all.a" "build/$1/libintono.a" "build/$1/libpffft.a"
          }
          build ios-device iphoneos "arm64"
          build ios-sim iphonesimulator "arm64;x86_64"
      - name: Check the slices
        run: |
          lipo -info build/ios-device/libintono_all.a build/ios-sim/libintono_all.a
          for lib in build/ios-device/libintono_all.a build/ios-sim/libintono_all.a; do
            n=$(nm -gU "$lib" 2>/dev/null | grep -c ' T _intono_')
            echo "$lib exports $n intono_ functions"
            [ "$n" -ge 8 ] || exit 1
          done
          mkdir x && cd x && ar x ../build/ios-device/libintono.a && xcrun vtool -show-build engine.cpp.o | tee ../platform.txt
          grep -q 'platform IOS$' ../platform.txt
      - name: xcframework
        run: |
          xcodebuild -create-xcframework \
            -library build/ios-device/libintono_all.a -headers dsp/include \
            -library build/ios-sim/libintono_all.a -headers dsp/include \
            -output build/intono.xcframework
      - uses: actions/upload-artifact@v4
        with: { name: intono-xcframework, path: build/intono.xcframework }

  # ADR 0009 answer 4 (mechanism per Note 4): the default build's output must be bit-identical to phase1-complete. Builds this commit
  # with the default options and compares the SHA-256 of intono-cli's output, case by case, with tools/accuracy/golden/phase1-complete.json
  # (all phrase sets of the synthetic dev corpus, each also with 3 s of digital silence appended, frames and notes), inline and through
  # the worker thread. The threaded runs are sleep-bound (the CLI waits for the 2 ms worker poll after every chunk), hence --jobs 32.
  bit-identity-vs-phase1:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env: { PYTHONDONTWRITEBYTECODE: "1" }
    steps:
      - uses: actions/checkout@v4
      - run: .github/scripts/apt-install.sh ninja-build cmake libsndfile1
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install $PY_PINS
      - name: Build this commit with the default options
        run: cmake -S dsp -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DINTONO_BUILD_TESTS=OFF && cmake --build build
      - name: Tests of the golden tool
        run: INTONO_CLI=build/intono-cli python tools/accuracy/test_golden.py
      - name: Inline
        run: python tools/accuracy/golden.py check --cli build/intono-cli --golden tools/accuracy/golden/phase1-complete.json --jobs 32
      - name: Through the worker thread
        run: python tools/accuracy/golden.py check --cli build/intono-cli --golden tools/accuracy/golden/phase1-complete.json --threaded --jobs 32

  # Provenance of the stored outputs (ADR 0009 Note 4): builds the phase1-complete tag itself and checks it against the manifest,
  # inline and threaded. Runs weekly, on manual runs, and on any push or PR that changes the manifest, golden.py or the corpus generator.
  golden-provenance:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env: { PYTHONDONTWRITEBYTECODE: "1" }
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 2 }   # HEAD^1..HEAD is the change under test (the PR merge commit, or the merge on main)
      - name: Decide whether to run
        id: need
        run: |
          if [ "${{ github.event_name }}" = schedule ] || [ "${{ github.event_name }}" = workflow_dispatch ]; then echo run=1 >> "$GITHUB_OUTPUT"; exit 0; fi
          git diff --name-only HEAD^1 HEAD | tee changed.txt
          if grep -qE '^tools/accuracy/(golden/|golden\.py|ref/synth\.py)|^\.github/workflows/dsp\.yml' changed.txt; then echo run=1; else echo run=0; fi >> "$GITHUB_OUTPUT"
      - if: steps.need.outputs.run == '1'
        run: .github/scripts/apt-install.sh ninja-build cmake libsndfile1
      - if: steps.need.outputs.run == '1'
        uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - if: steps.need.outputs.run == '1'
        run: pip install $PY_PINS
      - name: Build the phase1-complete tag
        if: steps.need.outputs.run == '1'
        run: |
          git fetch --depth=1 origin tag phase1-complete
          git rev-parse --verify phase1-complete^{commit}
          git worktree add "$RUNNER_TEMP/frozen" phase1-complete
          cmake -S "$RUNNER_TEMP/frozen/dsp" -B "$RUNNER_TEMP/frozen-build" -G Ninja -DCMAKE_BUILD_TYPE=Release -DINTONO_BUILD_TESTS=OFF
          cmake --build "$RUNNER_TEMP/frozen-build"
      - name: The tag reproduces the manifest (inline and threaded)
        if: steps.need.outputs.run == '1'
        run: |
          G=tools/accuracy/golden/phase1-complete.json
          python tools/accuracy/golden.py check --cli "$RUNNER_TEMP/frozen-build/intono-cli" --golden $G --jobs 32
          python tools/accuracy/golden.py check --cli "$RUNNER_TEMP/frozen-build/intono-cli" --golden $G --threaded --jobs 32

  # The OFF build must still compile and its guard tests must pass (it ships only in the bench APK, as information).
  denormal-guard-off:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: .github/scripts/apt-install.sh ninja-build cmake
      - run: cmake -S dsp -B build-off -G Ninja -DCMAKE_BUILD_TYPE=Release -DINTONO_DENORMAL_GUARD=OFF && cmake --build build-off
      - run: INTONO_EXPECT_GUARD=0 build-off/intono_tests --gtest_filter='DenormalGuard*'

# Still to do: run the public datasets (URMP, NSynth) in the accuracy gate, and run the unit tests on an iOS simulator.
