name: flutter-app
# ADR 0009 decision 3 and 6: the Flutter app. Flutter is installed from the official archive at a pinned version whose SHA-256 is in the
# repository (app/.flutter-version, app/.flutter-sha256); no third-party action. Pushes run CI only on main, a newer push to a PR cancels
# its running jobs, and apt goes through .github/scripts/apt-install.sh (see dsp.yml).
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["app/**", "android/shim/**", "ios/**", "dsp/**", ".github/workflows/flutter-app.yml"]
  pull_request:
    paths: ["app/**", "android/shim/**", "ios/**", "dsp/**", ".github/workflows/flutter-app.yml"]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  app:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - run: .github/scripts/apt-install.sh ninja-build cmake libclang-dev libsqlite3-dev
      # Caches (actions/cache, first-party like checkout): the Flutter archive (its SHA-256 is still verified after a restore), the pub
      # cache, and Gradle's dependency and wrapper caches (each uncached run fetched every dependency again, and Maven Central answered
      # 429 Too Many Requests). Keys change with the pins, so a pin change starts a fresh cache.
      - uses: actions/cache@v4
        with:
          path: ~/flutter-archive
          key: flutter-archive-${{ hashFiles('app/.flutter-version', 'app/.flutter-sha256') }}
      - uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: deps-${{ runner.os }}-${{ github.job }}-${{ hashFiles('app/pubspec.lock', 'app/android/**/*.gradle*', 'app/android/gradle/wrapper/gradle-wrapper.properties', 'app/.flutter-version') }}
          restore-keys: deps-${{ runner.os }}-${{ github.job }}-
      - name: Install the pinned Flutter (checksum verified)
        run: |
          V=$(cat app/.flutter-version); SUM=$(cat app/.flutter-sha256)
          A="$HOME/flutter-archive/flutter_linux_${V}-stable.tar.xz"
          mkdir -p "$HOME/flutter-archive"
          [ -f "$A" ] || curl -fsSL --retry 3 "https://storage.googleapis.com/flutter_infra_release/releases/stable/linux/flutter_linux_${V}-stable.tar.xz" -o "$A"
          echo "$SUM  $A" | sha256sum -c -
          tar -xf "$A" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
      - name: Analytics off
        run: |
          flutter config --no-analytics --no-cli-animations
          dart --disable-analytics
          flutter --version
      - name: Dependencies
        # The lockfile is enforced. If it does not match pubspec.yaml, pub resolves anyway so that the next step can print the lockfile
        # it should be, and that step then fails: CI is never green with a stale lockfile.
        working-directory: app
        run: |
          if [ -f pubspec.lock ]; then
            flutter pub get --enforce-lockfile || { echo "::warning::pubspec.lock does not match pubspec.yaml; resolving to print it"; flutter pub get; }
          else
            flutter pub get
          fi
      - name: Regenerate the FFI bindings and drift's code, and require them (and the lockfile) to be up to date
        working-directory: app
        run: |
          dart run ffigen --config ffigen.yaml
          dart run build_runner build   # ADR 0015: lib/src/db/practice_db.g.dart
          GEN="lib/src/ffi/intono_bindings.dart lib/src/db/practice_db.g.dart pubspec.lock"
          if [ -z "$(git status --porcelain -- $GEN)" ]; then echo "bindings, generated code and lockfile are up to date"; exit 0; fi
          git status --porcelain
          for f in $GEN; do echo "=====FILE app/$f"; cat "$f"; echo "=====END"; done
          exit 1
      - name: Scale data is what the generator makes (ADR 0011)
        run: python3 -B tools/scales/gen_scales.py --check
      - name: Analyze
        working-directory: app
        run: flutter analyze
      - name: Build libintono for the host (the FFI test loads it)
        run: |
          cmake -S dsp -B build-host -G Ninja -DINTONO_SHARED=ON -DINTONO_BUILD_TESTS=OFF -DINTONO_BUILD_CLI=OFF -DCMAKE_BUILD_TYPE=Release
          cmake --build build-host
          ls -l build-host/libintono.so
      - name: Test
        working-directory: app
        run: INTONO_LIB="$GITHUB_WORKSPACE/build-host/libintono.so" flutter test
      - name: Android SDK components (same pins as the harness)
        run: |
          echo "JAVA_HOME=$JAVA_HOME_17_X64" >> "$GITHUB_ENV"
          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$SDK/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0" "cmake;3.22.1" "ndk;30.0.16248370"
          flutter config --android-sdk "$SDK"
      - name: Build the debug APK
        working-directory: app
        run: flutter build apk --debug
      - name: Kotlin unit tests (drone policy)
        working-directory: app/android
        run: ./gradlew --no-daemon --stacktrace :app:testDebugUnitTest
      - name: Check the APK
        run: |
          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          APK=app/build/app/outputs/flutter-apk/app-debug.apk
          ls -l "$APK"
          BIN="$SDK/ndk/30.0.16248370/toolchains/llvm/prebuilt/linux-x86_64/bin"
          mkdir -p apk && cd apk && unzip -q -o "../$APK"
          for abi in arm64-v8a armeabi-v7a x86_64; do
            SO="lib/$abi/libintono_android.so"
            [ -f "$SO" ] || { echo "$abi: $SO missing"; exit 1; }
            [ -f "lib/$abi/liboboe.so" ] || { echo "$abi: liboboe.so missing"; exit 1; }
            [ -f "lib/$abi/libflutter.so" ] || { echo "$abi: libflutter.so missing"; exit 1; }
            # ADR 0009 Amendment 1: shared STL, so the shim needs libc++_shared.so and the APK must carry it.
            "$BIN/llvm-readelf" -d "$SO" | grep -q 'Shared library: \[libc++_shared.so\]' || { echo "$abi: libintono_android.so does not need libc++_shared.so"; exit 1; }
            unzip -l "../$APK" | grep -q "lib/$abi/libc++_shared.so" || { echo "$abi: libc++_shared.so is not packaged in the APK"; exit 1; }
            "$BIN/llvm-nm" -D --defined-only "$SO" | awk '$2=="T"{print $3}' | sort > "exported-$abi.txt"
            for sym in intono_create intono_destroy intono_drone_render intono_drone_set intono_process intono_read_frames intono_read_notes intono_set_tonic intono_set_expected; do
              grep -qx "$sym" "exported-$abi.txt" || { echo "$abi: $sym is not exported (dart:ffi could not resolve it)"; exit 1; }
            done
            grep -vE '^(intono_|Java_com_example_intono_)' "exported-$abi.txt" && { echo "$abi: unexpected exports above"; exit 1; } || true
            "$BIN/llvm-readelf" -lW "$SO" | awk '$1=="LOAD"{print $NF}' | while read a; do
              [ $((a)) -ge 16384 ] || { echo "$abi: LOAD segment aligned to $a, need 0x4000"; exit 1; }
            done
            for lib in liboboe.so libc++_shared.so libflutter.so; do   # information: Play needs 16 KB alignment for every library
              "$BIN/llvm-readelf" -lW "lib/$abi/$lib" | awk -v n="$abi/$lib" '$1=="LOAD"{print n, $NF}' | sort -u
            done
          done
      - uses: actions/upload-artifact@v4
        with: { name: intono-flutter-debug-apk, path: app/build/app/outputs/flutter-apk/app-debug.apk }
      - name: Build the bench APK (profile, arm64 only, with the guard-off comparison library)
        # The debug APK runs Dart in JIT and loads the audio thread's CPU with UI work; timing on the phone is judged on this AOT build.
        # INTONO_BENCH=1 adds libintono_bench_noguard.so (ADR 0009 answer 4); no other build contains it.
        working-directory: app
        env: { INTONO_BENCH: "1" }
        run: flutter build apk --profile --target-platform android-arm64
      - name: Check the bench APK
        run: |
          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          BIN="$SDK/ndk/30.0.16248370/toolchains/llvm/prebuilt/linux-x86_64/bin"
          APK=app/build/app/outputs/flutter-apk/app-profile.apk
          mkdir -p bench-apk && cd bench-apk && unzip -q -o "../$APK"
          SO=lib/arm64-v8a/libintono_bench_noguard.so
          [ -f "$SO" ] || { echo "the bench APK lacks $SO"; exit 1; }
          "$BIN/llvm-nm" -D --defined-only "$SO" | awk '$2=="T"{print $3}' | sort > exports.txt; cat exports.txt
          [ "$(cat exports.txt)" = "intono_bench_run" ] || { echo "the comparison library must export intono_bench_run and nothing else"; exit 1; }
          "$BIN/llvm-readelf" -lW "$SO" | awk '$1=="LOAD"{print $NF}' | while read a; do
            [ $((a)) -ge 16384 ] || { echo "LOAD segment aligned to $a, need 0x4000"; exit 1; }
          done
          "$BIN/llvm-nm" -D --defined-only lib/arm64-v8a/libintono_android.so | awk '{print $3}' | grep -qx intono_bench_run || { echo "the shim does not export intono_bench_run"; exit 1; }
      - name: The ordinary debug APK must not carry the comparison library
        run: |
          if unzip -l app/build/app/outputs/flutter-apk/app-debug.apk | grep -q libintono_bench_noguard; then echo "libintono_bench_noguard.so is in the debug APK"; exit 1; fi
      - uses: actions/upload-artifact@v4
        with: { name: intono-flutter-bench-apk, path: app/build/app/outputs/flutter-apk/app-profile.apk }

  # The CI emulator has no audio device (-no-audio): this proves library load, JNI and the engine on bionic, not capture.
  # Runs the instrumented smoke test of the Flutter host app (the harness app that used to carry it is retired, ADR 0009 Note 3).
  android-emulator:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Free disk space (the emulator image needs it; the Android SDK is kept)
        run: |
          df -h / | tail -1
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost /opt/hostedtoolcache/CodeQL /usr/local/.ghcup /usr/share/swift
          df -h / | tail -1
      - run: .github/scripts/apt-install.sh ninja-build cmake libclang-dev libpulse0 libnss3 libxcb-cursor0
      # Caches (actions/cache, first-party like checkout): the Flutter archive (its SHA-256 is still verified after a restore), the pub
      # cache, and Gradle's dependency and wrapper caches (each uncached run fetched every dependency again, and Maven Central answered
      # 429 Too Many Requests). Keys change with the pins, so a pin change starts a fresh cache.
      - uses: actions/cache@v4
        with:
          path: ~/flutter-archive
          key: flutter-archive-${{ hashFiles('app/.flutter-version', 'app/.flutter-sha256') }}
      - uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: deps-${{ runner.os }}-${{ github.job }}-${{ hashFiles('app/pubspec.lock', 'app/android/**/*.gradle*', 'app/android/gradle/wrapper/gradle-wrapper.properties', 'app/.flutter-version') }}
          restore-keys: deps-${{ runner.os }}-${{ github.job }}-
      - name: Install the pinned Flutter (checksum verified)
        run: |
          V=$(cat app/.flutter-version); SUM=$(cat app/.flutter-sha256)
          A="$HOME/flutter-archive/flutter_linux_${V}-stable.tar.xz"
          mkdir -p "$HOME/flutter-archive"
          [ -f "$A" ] || curl -fsSL --retry 3 "https://storage.googleapis.com/flutter_infra_release/releases/stable/linux/flutter_linux_${V}-stable.tar.xz" -o "$A"
          echo "$SUM  $A" | sha256sum -c -
          tar -xf "$A" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
      - name: Toolchain (pinned) and emulator image
        run: |
          echo "JAVA_HOME=$JAVA_HOME_17_X64" >> "$GITHUB_ENV"
          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          echo "SDK=$SDK" >> "$GITHUB_ENV"
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$SDK/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0" "cmake;3.22.1" "ndk;30.0.16248370" \
            "platform-tools" "emulator" "system-images;android-34;google_apis;x86_64"
          flutter config --no-analytics --no-cli-animations --android-sdk "$SDK"
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm
      - name: Flutter host project (pub get and a debug build, which create the Gradle wrapper and local.properties)
        working-directory: app
        run: |
          flutter pub get --enforce-lockfile
          flutter build apk --debug --target-platform android-x64
      - name: Boot the emulator and run the instrumented smoke test
        run: |
          export PATH="$SDK/platform-tools:$SDK/emulator:$SDK/cmdline-tools/latest/bin:$PATH"
          export ANDROID_AVD_HOME="$HOME/.android/avd"; mkdir -p "$ANDROID_AVD_HOME"
          printf 'no\n' | avdmanager create avd -n ci -k "system-images;android-34;google_apis;x86_64" -d pixel_5 --force
          nohup emulator -avd ci -no-window -no-audio -no-boot-anim -no-snapshot -no-metrics -gpu swiftshader_indirect -accel on > emulator.log 2>&1 &
          EMU=$!
          for i in $(seq 1 120); do
            kill -0 $EMU 2>/dev/null || { echo "emulator process exited early"; cat emulator.log; exit 1; }
            [ "$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" = "1" ] && break
            sleep 5
          done
          [ "$(adb shell getprop sys.boot_completed | tr -d '\r')" = "1" ] || { echo "emulator did not boot"; cat emulator.log; exit 1; }
          (cd app/android && ./gradlew --no-daemon --stacktrace :app:connectedDebugAndroidTest)
          # ADR 0015 decision 1: the bundled SQLite opens, writes, reopens and clears the real database file on the device.
          (cd app && flutter test integration_test/practice_db_test.dart -d emulator-5554)
          adb emu kill || true

  # ADR 0010: the iOS app on the Simulator only (no signing, no Apple account, no IPA). Builds IntonoNative.xcframework from this
  # repository, then the Flutter app for the arm64 Simulator, and checks the binary. Capture is not asserted here (the runner may have no
  # audio input); real-iPhone testing is the TestFlight milestone before the iOS launch.
  ios-app:
    runs-on: macos-15   # pinned (ADR 0005)
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: ~/flutter-archive
          key: flutter-archive-macos-arm64-${{ hashFiles('app/.flutter-version', 'app/.flutter-sha256-macos-arm64') }}
      - name: Install the pinned Flutter for macOS arm64 (checksum verified)
        run: |
          V=$(cat app/.flutter-version); SUM=$(cat app/.flutter-sha256-macos-arm64)
          A="$HOME/flutter-archive/flutter_macos_arm64_${V}-stable.zip"
          mkdir -p "$HOME/flutter-archive"
          [ -f "$A" ] || curl -fsSL --retry 3 "https://storage.googleapis.com/flutter_infra_release/releases/stable/macos/flutter_macos_arm64_${V}-stable.zip" -o "$A"
          echo "$SUM  $A" | shasum -a 256 -c -
          unzip -q "$A" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
      - name: Toolchain
        run: |
          brew install ninja
          flutter config --no-analytics --no-cli-animations --enable-swift-package-manager
          dart --disable-analytics
          flutter --version
          xcodebuild -version
      - name: Shim host tests on macOS arm64 (AudioPump, bench, soak, pump_text; the portable core iOS compiles)
        run: |
          cmake -S android/shim -B build-shim -G Ninja -DINTONO_SANITIZE=none
          cmake --build build-shim
          ctest --test-dir build-shim --output-on-failure
      - name: Build IntonoNative.xcframework (libintono + portable core + AVAudioEngine session; device and Simulator slices)
        run: ios/shim/build_xcframework.sh app/packages/intono_ios/ios/intono_ios
      - name: Build the app for the Simulator (debug, no codesign)
        working-directory: app
        run: |
          flutter pub get --enforce-lockfile
          flutter build ios --simulator --debug --no-codesign
      - name: Check the app
        run: |
          APP=app/build/ios/iphonesimulator/Runner.app
          ls "$APP"
          [ "$(plutil -extract NSMicrophoneUsageDescription raw "$APP/Info.plist")" != "" ] || { echo "NSMicrophoneUsageDescription missing"; exit 1; }
          echo "MinimumOSVersion $(plutil -extract MinimumOSVersion raw "$APP/Info.plist")"
          BINS="$APP/Runner"; [ -f "$APP/Runner.debug.dylib" ] && BINS="$BINS $APP/Runner.debug.dylib"
          nm -gU $BINS 2>/dev/null | grep -E ' T _intono_' | awk '{print $3}' | sort -u | tee exported.txt
          # dart:ffi resolves these with dlsym in the process (DynamicLibrary.process(), ADR 0010)
          for sym in intono_create intono_destroy intono_drone_render intono_drone_set intono_process intono_read_frames intono_read_notes intono_set_tonic intono_set_expected intono_bench_run; do
            grep -qx "_$sym" exported.txt || { echo "_$sym is not in the app binary"; exit 1; }
          done
      - name: XCTest smoke tests on a booted Simulator (pinned runtime iOS 18.5, iPhone 16)
        working-directory: app/ios
        run: |
          xcrun simctl list runtimes | grep -q 'iOS 18.5' || { echo "pinned Simulator runtime iOS 18.5 is not on this image"; xcrun simctl list runtimes; exit 1; }
          xcodebuild test -workspace Runner.xcworkspace -scheme Runner \
            -destination 'platform=iOS Simulator,name=iPhone 16,OS=18.5' \
            -resultBundlePath "$RUNNER_TEMP/ios-tests.xcresult" CODE_SIGNING_ALLOWED=NO 2>&1 | tee "$RUNNER_TEMP/xcodebuild-test.log" | grep -E 'Test |passed|failed|error|ios session' ; test "${PIPESTATUS[0]}" -eq 0
      - name: The practice database on the Simulator (ADR 0015 decision 1)
        working-directory: app
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin)["devices"]; print(next(x["udid"] for k,v in d.items() if k.endswith("iOS-18-5") for x in v if x["name"]=="iPhone 16"))')
          xcrun simctl boot "$UDID" 2>/dev/null || true
          xcrun simctl bootstatus "$UDID" -b
          flutter test integration_test/practice_db_test.dart -d "$UDID"
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: ios-test-log, path: "${{ runner.temp }}/xcodebuild-test.log" }
