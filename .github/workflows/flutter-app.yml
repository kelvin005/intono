name: flutter-app
# ADR 0009 decision 3 and 6: the Flutter app. Flutter is installed from the official archive at a pinned version whose SHA-256 is in the
# repository (app/.flutter-version, app/.flutter-sha256); no third-party action.
on:
  workflow_dispatch:
  push:
    paths: ["app/**", "android/shim/**", "android/app/src/main/kotlin/**", "dsp/**", ".github/workflows/flutter-app.yml"]
  pull_request:
    paths: ["app/**", "android/shim/**", "android/app/src/main/kotlin/**", "dsp/**", ".github/workflows/flutter-app.yml"]

jobs:
  app:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y ninja-build cmake libclang-dev
      - name: Install the pinned Flutter (checksum verified)
        run: |
          V=$(cat app/.flutter-version); SUM=$(cat app/.flutter-sha256)
          curl -fsSL "https://storage.googleapis.com/flutter_infra_release/releases/stable/linux/flutter_linux_${V}-stable.tar.xz" -o flutter.tar.xz
          echo "$SUM  flutter.tar.xz" | sha256sum -c -
          tar -xf flutter.tar.xz -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
          rm flutter.tar.xz
      - name: Analytics off
        run: |
          flutter config --no-analytics --no-cli-animations
          dart --disable-analytics
          flutter --version
      - name: Dependencies
        working-directory: app
        run: |
          if [ -f pubspec.lock ]; then flutter pub get --enforce-lockfile; else flutter pub get; fi
      - name: Regenerate the FFI bindings and require them to be up to date
        working-directory: app
        run: |
          dart run ffigen --config ffigen.yaml
          if [ -z "$(git status --porcelain -- lib/src/ffi/intono_bindings.dart pubspec.lock)" ]; then echo "bindings and lockfile are up to date"; exit 0; fi
          git status --porcelain
          echo "=====FILE app/lib/src/ffi/intono_bindings.dart"; cat lib/src/ffi/intono_bindings.dart; echo "=====END"
          echo "=====FILE app/pubspec.lock"; cat pubspec.lock; echo "=====END"
          exit 1
      - name: Analyze
        working-directory: app
        run: flutter analyze
      - name: Build libintono for the host (the FFI test loads it)
        run: |
          cmake -S dsp -B build-host -G Ninja -DINTONO_SHARED=ON -DINTONO_BUILD_TESTS=OFF -DINTONO_BUILD_CLI=OFF -DCMAKE_BUILD_TYPE=Release
          cmake --build build-host
          ls -l build-host/libintono.so
      - name: Test
        working-directory: app
        run: INTONO_LIB="$GITHUB_WORKSPACE/build-host/libintono.so" flutter test
      - name: Android SDK components (same pins as the harness)
        run: |
          echo "JAVA_HOME=$JAVA_HOME_17_X64" >> "$GITHUB_ENV"
          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$SDK/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0" "cmake;3.22.1" "ndk;30.0.16248370"
          flutter config --android-sdk "$SDK"
      - name: Build the debug APK
        working-directory: app
        run: flutter build apk --debug
      - name: Check the APK
        run: |
          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          APK=app/build/app/outputs/flutter-apk/app-debug.apk
          ls -l "$APK"
          BIN="$SDK/ndk/30.0.16248370/toolchains/llvm/prebuilt/linux-x86_64/bin"
          mkdir -p apk && cd apk && unzip -q -o "../$APK"
          for abi in arm64-v8a armeabi-v7a x86_64; do
            SO="lib/$abi/libintono_android.so"
            [ -f "$SO" ] || { echo "$abi: $SO missing"; exit 1; }
            [ -f "lib/$abi/liboboe.so" ] || { echo "$abi: liboboe.so missing"; exit 1; }
            [ -f "lib/$abi/libflutter.so" ] || { echo "$abi: libflutter.so missing"; exit 1; }
            # ADR 0009 Amendment 1: shared STL, so the shim needs libc++_shared.so and the APK must carry it.
            "$BIN/llvm-readelf" -d "$SO" | grep -q 'Shared library: \[libc++_shared.so\]' || { echo "$abi: libintono_android.so does not need libc++_shared.so"; exit 1; }
            unzip -l "../$APK" | grep -q "lib/$abi/libc++_shared.so" || { echo "$abi: libc++_shared.so is not packaged in the APK"; exit 1; }
            "$BIN/llvm-nm" -D --defined-only "$SO" | awk '$2=="T"{print $3}' | sort > "exported-$abi.txt"
            for sym in intono_create intono_destroy intono_drone_render intono_drone_set intono_process intono_read_frames intono_read_notes intono_set_tonic; do
              grep -qx "$sym" "exported-$abi.txt" || { echo "$abi: $sym is not exported (dart:ffi could not resolve it)"; exit 1; }
            done
            grep -vE '^(intono_|Java_com_example_intono_)' "exported-$abi.txt" && { echo "$abi: unexpected exports above"; exit 1; } || true
            "$BIN/llvm-readelf" -lW "$SO" | awk '$1=="LOAD"{print $NF}' | while read a; do
              [ $((a)) -ge 16384 ] || { echo "$abi: LOAD segment aligned to $a, need 0x4000"; exit 1; }
            done
            for lib in liboboe.so libc++_shared.so libflutter.so; do   # information: Play needs 16 KB alignment for every library
              "$BIN/llvm-readelf" -lW "lib/$abi/$lib" | awk -v n="$abi/$lib" '$1=="LOAD"{print n, $NF}' | sort -u
            done
          done
      - uses: actions/upload-artifact@v4
        with: { name: intono-flutter-debug-apk, path: app/build/app/outputs/flutter-apk/app-debug.apk }
      - name: Build the bench APK (profile, arm64 only, with the guard-off comparison library)
        # The debug APK runs Dart in JIT and loads the audio thread's CPU with UI work; timing on the phone is judged on this AOT build.
        # INTONO_BENCH=1 adds libintono_bench_noguard.so (ADR 0009 answer 4); no other build contains it.
        working-directory: app
        env: { INTONO_BENCH: "1" }
        run: flutter build apk --profile --target-platform android-arm64
      - name: Check the bench APK
        run: |
          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          BIN="$SDK/ndk/30.0.16248370/toolchains/llvm/prebuilt/linux-x86_64/bin"
          APK=app/build/app/outputs/flutter-apk/app-profile.apk
          mkdir -p bench-apk && cd bench-apk && unzip -q -o "../$APK"
          SO=lib/arm64-v8a/libintono_bench_noguard.so
          [ -f "$SO" ] || { echo "the bench APK lacks $SO"; exit 1; }
          "$BIN/llvm-nm" -D --defined-only "$SO" | awk '$2=="T"{print $3}' | sort > exports.txt; cat exports.txt
          [ "$(cat exports.txt)" = "intono_bench_run" ] || { echo "the comparison library must export intono_bench_run and nothing else"; exit 1; }
          "$BIN/llvm-readelf" -lW "$SO" | awk '$1=="LOAD"{print $NF}' | while read a; do
            [ $((a)) -ge 16384 ] || { echo "LOAD segment aligned to $a, need 0x4000"; exit 1; }
          done
          "$BIN/llvm-nm" -D --defined-only lib/arm64-v8a/libintono_android.so | awk '{print $3}' | grep -qx intono_bench_run || { echo "the shim does not export intono_bench_run"; exit 1; }
      - name: The ordinary debug APK must not carry the comparison library
        run: |
          if unzip -l app/build/app/outputs/flutter-apk/app-debug.apk | grep -q libintono_bench_noguard; then echo "libintono_bench_noguard.so is in the debug APK"; exit 1; fi
      - uses: actions/upload-artifact@v4
        with: { name: intono-flutter-bench-apk, path: app/build/app/outputs/flutter-apk/app-profile.apk }
